{% extends 'dashboard.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="card-body ">
                  <h4 class="card-title"  style="font-size: 32px;">PRODUCT</h4>
                  <p class="card-description">
                  Enter the details of product
                  </p>

                  <form class="forms-sample" method="post" action="{% url 'save_product' %}" enctype="multipart/form-data">
                      {% csrf_token %}
                    <div class="form-group">
                      <label for="category">Category </label>

                        <select class="form-control" id="category"  name="category">
                            <option selected disabled>Select Category of product</option>
                            {% for i in categories %}
                            <option value="{{i.Name}}">{{i.Name}}</option>

                            {% endfor %}
                        </select>


                    </div>


                      <div class="form-group">
                      <label for="product">Product Name</label>
                      <input type="text" class="form-control" id="product" placeholder="Product Name" name="product">
                    </div>

                      <div class="form-group">
                      <label for="price">Price</label>
                      <input type="number" class="form-control" id="price" placeholder="Price" name="price">
                    </div>


                      <div class="form-group">
                      <label for="brand">Brand Name</label>
                      <input type="text" class="form-control" id="brand" placeholder="Brand Name" name="brand">
                    </div>


                      <div class="form-group">
                      <label for="short-description">Short Description</label>
                      <textarea class="form-control" id="short-description" rows="3" name="short-description"></textarea>
                    </div>

                      <div class="form-group">
                      <label for="detailed-description">Description</label>
                      <textarea class="form-control" id="detailed-description" rows="10" name="detailed-description"></textarea>
                    </div>


                    <div class="form-group">
                         <label >Image1</label>
                <input type="file" name="image1" class="form-control">

                    </div>
                      <div class="form-group">
                         <label >Image2</label>
                <input type="file" name="image2" class="form-control">

                    </div>
                      <div class="form-group">
                         <label >Image3</label>
                <input type="file" name="image3" class="form-control">

                    </div>


                    <button type="submit" class="btn btn-primary mr-2">Submit</button>
                    <button class="btn btn-light">Cancel</button>
                  </form>
                </div>
</body>
</html>
{% endblock %}
