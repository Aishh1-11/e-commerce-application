{% extends 'dashboard.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="col-lg-12 stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">Categories</h4>
                  <p class="card-description">
                    <code></code>
                  </p>
                  <div class="table-responsive pt-3">
                    <table class="table table-bordered">
                      <thead>
                        <tr>

                          <th>
                            Category name
                          </th>
                          <th>
                            Description
                          </th>
                          <th>
                           Image
                          </th>
                          <th>
                            Actions
                          </th>
                        </tr>
                      </thead>
                      <tbody>

                      {% for i in category_data %}

                        <tr class="table-info">
                          <td>
                            {{i.Name}}
                          </td>
                          <td style="max-width:250px; word-wrap:break-word;white-space: normal;">
                            {{i.Description}}
                          </td>
                          <td >
                            <img src="{{ i.Image.url }}" >
                          </td>
                          <td>
                          <div  class="d-flex " style=" gap: 8px;">
                               <a href="{% url 'edit_category' i.id %}" class="btn btn-outline-primary "  >Edit</a>
                              <form method="post" action="{% url 'delete_category' i.id %}">
                                     {% csrf_token %}
                                  <button type="submit" class=" ms-3 btn btn-outline-danger " onclick="return confirm('Are you sure you want to delete this category?')" >Delete</button>
                                  </form>
                          </div>



                          </td>

                        </tr>
                      {% endfor %}


                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
</body>
</html>
{% endblock %}



\
